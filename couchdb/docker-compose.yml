# Local-dev CouchDB for cardflashs.
#
# Brings up CouchDB 3.4 with:
#   - JWT auth (RS256, keys loaded from couchdb/jwt-keys.ini)
#   - couch_peruser (auto-creates userdb-<hex(sub)> for each Google user)
#   - CORS for the Vite dev server
#
# Usage:
#   1. Run scripts/refresh-jwt-keys.sh to fetch Google's current public keys
#      into couchdb/jwt-keys.ini.
#   2. docker compose -f couchdb/docker-compose.yml up -d
#   3. On first boot only, hit http://localhost:5984/_cluster_setup or just let
#      single-node mode finalize itself by visiting http://localhost:5984/_utils

services:
  couchdb:
    image: couchdb:3.4
    container_name: cardflashs-couchdb
    restart: unless-stopped
    ports:
      - "5984:5984"
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin
    volumes:
      - couchdb-data:/opt/couchdb/data
      - ./local.ini:/opt/couchdb/etc/local.d/10-cardflashs.ini:ro
      - ./jwt-keys.ini:/opt/couchdb/etc/local.d/20-jwt-keys.ini:ro

volumes:
  couchdb-data:
