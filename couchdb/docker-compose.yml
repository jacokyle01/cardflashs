# Local-dev CouchDB for cardflashs.
#
# Brings up CouchDB 3.4 with:
#   - admin Basic auth (admin / admin) defined directly in local.ini
#   - CORS for the Vite dev server
#
# JWT validation is intentionally disabled in this setup. Identity comes
# from Google sign-in client-side; the browser uses the admin credentials
# above to talk to CouchDB. Dev only.
#
# We bypass the official `/docker-entrypoint.sh` because its "is admin already
# set?" heuristic exits silently (matching a commented example in default.ini)
# and never writes the admin credentials. Since [admins] lives in our own
# local.ini, the entrypoint's setup work isn't needed.
#
# Usage:
#   docker compose -f couchdb/docker-compose.yml up -d
#   open http://localhost:5984/_utils    (Fauxton UI; admin / admin)

services:
  couchdb:
    image: couchdb:3.4
    user: "5984:5984"           # the `couchdb` user/group baked into the image
    entrypoint: ["tini", "--", "/opt/couchdb/bin/couchdb"]
    ports:
      - "5984:5984"
    volumes:
      - couchdb-data:/opt/couchdb/data
      - ./local.ini:/opt/couchdb/etc/local.d/10-cardflashs.ini:ro

volumes:
  couchdb-data:
