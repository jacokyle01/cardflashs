; cardflashs CouchDB configuration.
;
;   cp couchdb/local.example.ini couchdb/local.ini
;   chmod 666 couchdb/local.ini        # CouchDB (uid 5984) must be able to write it
;
; local.ini is gitignored and is the ONLY config file docker-compose mounts.
; It is mounted read-write because CouchDB writes back into it: the admin
; password is replaced by its hash on first boot, and the token functions
; register agent-token signing keys under [jwt_keys] through the config API.
; Back it up along with the data volume.
;
; For production, copy this file and change the three values marked PROD.
;
; Auth model:
;   - The browser and any AI agent talk to CouchDB directly with a JWT in
;     the Authorization header. CouchDB verifies it against [jwt_keys].
;   - Browser JWTs (1h) are minted by the Pages Function in functions/api/token.ts
;     after it verifies the user's Firebase ID token, signed with `hmac:app`.
;   - Agent JWTs (long-lived) are signed with a per-token key `hmac:agent-<id>`
;     that the function registers via the /_node/_local/_config API. Revoking
;     a token is deleting that key.
;   - Each user gets `userdb-<hex(uid)>`. Its _security lists the uid as the
;     only member, and the role `owner:<uid>` (carried only by browser tokens)
;     as DB admin so PouchDB can replicate design docs.
;   - The admin credentials below are used only by the function. They never
;     reach the browser.

; --- Admin --------------------------------------------------------------------
; PROD: set a strong password. CouchDB replaces it with a -pbkdf2- hash on
; first boot. To change it later, put the new plaintext here and restart.
;
; (The official couchdb:3.4 Docker entrypoint tries to populate this section
; from $COUCHDB_USER/$COUCHDB_PASSWORD, but its "is admin already set?"
; heuristic matches a commented example in default.ini and silently skips
; the write, so docker-compose bypasses the entrypoint and we define it here.)

[admins]
admin = admin

; --- Authentication ---------------------------------------------------------------

[chttpd]
enable_cors = true
; Reject unauthenticated requests outright (no public/anonymous access).
require_valid_user = true
; JWT first, then cookie (Fauxton) and Basic (the function's admin calls).
authentication_handlers = {chttpd_auth, jwt_authentication_handler}, {chttpd_auth, cookie_authentication_handler}, {chttpd_auth, default_authentication_handler}

[jwt_auth]
; Every token we mint carries exp; refuse any that doesn't.
required_claims = exp
; Claim that carries CouchDB roles (the function sets `owner:<uid>` here).
roles_claim_name = _couchdb.roles

[jwt_keys]
; Browser-token signing key: base64 HMAC secret, MUST equal COUCHDB_JWT_SECRET
; in the function's environment (.dev.vars locally, Cloudflare in prod).
; PROD: generate a fresh one with  openssl rand -base64 32
; Agent keys (hmac:agent-<id>) are appended below this line by CouchDB when
; the function registers them. Do not hand-edit those.
hmac:app = ZGV2LW9ubHktY2FyZGZsYXNocy1qd3Qtc2VjcmV0LTAwMDA=

; --- CORS ---------------------------------------------------------------------
; PROD: set origins to the app's origin(s), e.g.
;   origins = https://cardflashs.com, https://cardflashs.pages.dev

[cors]
credentials = true
origins = http://localhost:5173, http://127.0.0.1:5173
methods = GET, PUT, POST, HEAD, DELETE
headers = accept, authorization, content-type, origin, referer, x-csrf-token
