; cardflashs CouchDB configuration. Mounted at
; /opt/couchdb/etc/local.d/10-cardflashs.ini by docker-compose.
;
; Auth model:
;   - The browser and any AI agent talk to CouchDB directly with a JWT in
;     the Authorization header. CouchDB verifies it against [jwt_keys] below.
;   - Browser JWTs (1h) are minted by the Pages Function in functions/api/token.ts
;     after it verifies the user's Firebase ID token. They are signed with the
;     `hmac:app` key.
;   - Agent JWTs (long-lived) are signed with a per-token key `hmac:agent-<id>`
;     that the function registers via the /_node/_local/_config API. Revoking
;     a token is deleting that key.
;   - Each user gets `userdb-<hex(uid)>`. Its _security lists the uid as the
;     only member, and the role `owner:<uid>` (carried only by browser tokens)
;     as DB admin so PouchDB can replicate design docs.
;   - The admin credentials below are used only by the function. They never
;     reach the browser.

; --- Admin --------------------------------------------------------------------
; The official couchdb:3.4 Docker entrypoint tries to populate this section
; from $COUCHDB_USER/$COUCHDB_PASSWORD, but its "is admin already set?" heuristic
; matches a commented example in default.ini and silently skips the write,
; leaving the node admin-less and aborting startup. Define it here directly;
; CouchDB hashes the plaintext password on first boot.
; Change this for any non-local deployment.

[admins]
admin = admin

; --- Authentication ---------------------------------------------------------------

[chttpd]
enable_cors = true
; Reject unauthenticated requests outright (no public/anonymous access).
require_valid_user = true
; JWT first, then cookie (Fauxton) and Basic (the function's admin calls).
authentication_handlers = {chttpd_auth, jwt_authentication_handler}, {chttpd_auth, cookie_authentication_handler}, {chttpd_auth, default_authentication_handler}

[jwt_auth]
; Every token we mint carries exp; refuse any that doesn't.
required_claims = exp
; Claim that carries CouchDB roles (the function sets `owner:<uid>` here).
roles_claim_name = _couchdb.roles

[jwt_keys]
; Browser-token signing key. Base64-encoded HMAC secret; MUST equal
; COUCHDB_JWT_SECRET in the function's environment. This value is a dev
; placeholder — generate a real one for production:  openssl rand -base64 32
; Agent keys (hmac:agent-<id>) are added at runtime by the function through
; the /_node/_local/_config API. CouchDB persists them to the last ini file it
; loaded — in docker-compose that is local.d/99-runtime.ini on the
; couchdb-config volume. Any deployment must keep that last file writable.
hmac:app = ZGV2LW9ubHktY2FyZGZsYXNocy1qd3Qtc2VjcmV0LTAwMDA=

; --- CORS ---------------------------------------------------------------------
; Browser app talks to CouchDB cross-origin from the Vite dev server.
; Tighten `origins` for any non-local deployment.

[cors]
credentials = true
origins = http://localhost:5173, http://127.0.0.1:5173
methods = GET, PUT, POST, HEAD, DELETE
headers = accept, authorization, content-type, origin, referer, x-csrf-token
