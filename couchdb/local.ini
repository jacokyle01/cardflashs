; cardflashs CouchDB configuration. Mounted at
; /opt/couchdb/etc/local.d/10-cardflashs.ini by docker-compose.
;
; This enables JWT auth using Google ID tokens, isolates each user's data into
; their own database via couch_peruser, and turns on CORS so the Vite-served
; SPA can talk to CouchDB directly.

[chttpd]
require_valid_user = false
bind_address = 0.0.0.0

[chttpd_auth]
; Order matters: try the JWT presented by the browser first; cookie auth lets
; the admin UI keep working with the COUCHDB_USER credentials.
authentication_handlers = {chttpd_auth, jwt_authentication_handler}, {chttpd_auth, cookie_authentication_handler}, {chttpd_auth, default_authentication_handler}

[jwt_auth]
; Reject tokens whose claims don't match. `sub` is what we map to the CouchDB
; user, `exp` enforces token expiry, `iss`/`aud` pin the token to Google +
; this client. CouchDB compares them against the values listed below.
required_claims = sub, exp, iss, aud

; Google's RS256 signing keys live in jwt-keys.ini under [jwt_keys]. Update
; them by running scripts/refresh-jwt-keys.sh — Google rotates them ~daily.
;
; Tokens whose `kid` header doesn't match any configured key will be rejected.

[chttpd_auth_jwt]
; CouchDB derives the user name from this claim. Google ID tokens put the
; stable user ID in `sub`, which is what we want for per-user databases.
username_claim = sub

[couch_peruser]
enable = true
; Each user gets their own DB at userdb-<hex(name)> with themselves as the
; only member. delete_dbs = false leaves data in place if a user is deleted
; (defensive — flip to true only if you're sure).
delete_dbs = false

[couchdb]
single_node = true

; --- CORS ---------------------------------------------------------------------
; The browser app talks to CouchDB cross-origin during local development.
; Tighten `origins` for production deployments.

[httpd]
enable_cors = true

[cors]
credentials = true
origins = http://localhost:5173, http://127.0.0.1:5173
methods = GET, PUT, POST, HEAD, DELETE
headers = accept, authorization, content-type, origin, referer, x-csrf-token
